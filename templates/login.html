<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f4f6f9;
}

.container{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0px 2px 10px rgba(0,0,0,0.1);
width:320px;
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.eye-box{
position:relative;
}

.eye-box i{
position:absolute;
right:12px;
top:22px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h2>User Login </h2>

<form method="POST">

<!-- Email -->
<input type="email"
name="email"
placeholder="Enter Email"
required>


<!-- Password -->
<div class="eye-box">

<input type="password"
name="password"
id="loginPass"
placeholder="Enter Password"
required>

<i class="fa fa-eye"
id="loginEye"
onclick="toggleLoginPass()"></i>

</div>

<!-- Forgot Password -->
<div style="text-align:right;margin-top:5px;">
<a href="/forgot_password">Forgot Password?</a>
</div>

<br>

<button type="submit">Login</button>

</form>


<!-- Register Link -->
<div style="text-align:center;margin-top:20px;">
Don't have account?
<a href="/register">Register Here</a>
</div>

</div>


<script>

function toggleLoginPass(){

var pass=document.getElementById("loginPass");
var icon=document.getElementById("loginEye");

if(pass.type==="password"){
pass.type="text";
icon.classList.replace("fa-eye","fa-eye-slash");
}
else{
pass.type="password";
icon.classList.replace("fa-eye-slash","fa-eye");
}

}

</script>

</body>
</html>
