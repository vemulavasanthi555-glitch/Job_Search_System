<!DOCTYPE html>
<html>
<head>

<title>Admin Register</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    font-family: Arial;
    background: linear-gradient(120deg,#2c3e50,#3498db);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:40px;
    width:380px;
    border-radius:12px;
    text-align:center;
    box-shadow:0px 0px 20px rgba(0,0,0,0.2);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ddd;
}

.pass-box{
    position:relative;
}

.eye-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2c3e50;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

a{
    text-decoration:none;
    color:#3498db;
}

</style>

</head>

<body>

<div class="box">

<h2>Admin Register</h2>

<form method="POST">

<input type="text" name="username" placeholder="Username" required>

<input type="email" name="email" placeholder="Email" required>

<div class="pass-box">

<input type="password" id="password1"
name="password"
placeholder="Create Password" required>

<i class="fa fa-eye eye-icon" id="togglePassword1"></i>

</div>

<div class="pass-box">

<input type="password" id="password2"
name="confirm_password"
placeholder="Confirm Password" required>

<i class="fa fa-eye eye-icon" id="togglePassword2"></i>

</div>

<br>

<button type="submit">Register</button>

<br><br>

<a href="{{ url_for('admin_login') }}">
Back to Login
</a>

</form>

</div>

<script>

function toggleEye(passwordField, icon){

    const type = passwordField.getAttribute("type") === "password"
    ? "text"
    : "password";

    passwordField.setAttribute("type", type);

    icon.classList.toggle("fa-eye");
    icon.classList.toggle("fa-eye-slash");
}

const password1 = document.querySelector("#password1");
const password2 = document.querySelector("#password2");

const toggle1 = document.querySelector("#togglePassword1");
const toggle2 = document.querySelector("#togglePassword2");

toggle1.addEventListener("click", function(){
    toggleEye(password1,this);
});

toggle2.addEventListener("click", function(){
    toggleEye(password2,this);
});

</script>

</body>
</html>
