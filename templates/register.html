<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f4f6f9;
}

.container{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0px 2px 10px rgba(0,0,0,0.1);
width:320px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.eye-box{
position:relative;
}

.eye-box i{
position:absolute;
right:12px;
top:22px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h2>Register </h2>

<form method="POST">

<input type="text" name="name" placeholder="Name" required>

<input type="email" name="email" placeholder="Email" required>


<!-- Password -->
<div class="eye-box">

<input type="password" id="pwd1"
name="password"
placeholder="Password" required>

<i class="fa fa-eye"
onclick="togglePwd1()"
id="eye1"></i>

</div>


<!-- Confirm Password -->
<div class="eye-box">

<input type="password" id="pwd2"
name="confirm_password"
placeholder="Confirm Password" required>

<i class="fa fa-eye"
onclick="togglePwd2()"
id="eye2"></i>

</div>
<input type="text" name="phone" placeholder="Phone Number"required>
<input type="text" name="skills" placeholder="Enter Skills(Python,SQL,HTML)"required>
<button type="submit" onclick="return validatePwd()">
Register
</button>

</form>

<br>
<a href="/login">Login</a>

</div>


<script>

function togglePwd1(){

var p=document.getElementById("pwd1");
var i=document.getElementById("eye1");

if(p.type==="password"){
p.type="text";
i.classList.replace("fa-eye","fa-eye-slash");
}
else{
p.type="password";
i.classList.replace("fa-eye-slash","fa-eye");
}

}

function togglePwd2(){

var p=document.getElementById("pwd2");
var i=document.getElementById("eye2");

if(p.type==="password"){
p.type="text";
i.classList.replace("fa-eye","fa-eye-slash");
}
else{
p.type="password";
i.classList.replace("fa-eye-slash","fa-eye");
}

}

function validatePwd(){

var p1=document.getElementById("pwd1").value;
var p2=document.getElementById("pwd2").value;

if(p1 !== p2){
alert("Passwords do not match!");
return false;
}

return true;
}

</script>

</body>
</html>
