
<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0px 2px 10px rgba(0,0,0,0.1);
width:300px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.eye-box{
position:relative;
}

.eye-box i{
position:absolute;
right:12px;
top:22px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Forgot Password 💙</h2>

<form method="POST">

<input type="email"
name="email"
placeholder="Enter Email"
required>


<div class="eye-box">

<input type="password"
name="password"
id="password"
placeholder="Enter New Password"
required>

<i class="fa fa-eye"
id="eyeIcon"
onclick="togglePassword()"></i>

</div>

<button type="submit">Reset Password</button>

</form>

<br>

<a href="/login">Back to Login</a>

</div>


<script>

function togglePassword(){

var pass = document.getElementById("password");
var icon = document.getElementById("eyeIcon");

if(pass.type === "password"){
pass.type = "text";
icon.classList.remove("fa-eye");
icon.classList.add("fa-eye-slash");
}
else{
pass.type = "password";
icon.classList.remove("fa-eye-slash");
icon.classList.add("fa-eye");
}

}

</script>

</body>
</html>
