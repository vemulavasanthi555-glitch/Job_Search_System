<!DOCTYPE html>
<html>
<head>

<title>Apply Job</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(120deg,#2c3e50,#3498db);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.form-box{
    background:white;
    padding:40px;
    width:400px;
    border-radius:15px;
    text-align:center;
    box-shadow:0px 0px 20px rgba(0,0,0,0.2);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ddd;
}

button{
    width:100%;
    padding:12px;
    background:#2c3e50;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="form-box">

<h2>Apply Job</h2>

{% if job %}
<h3>{{ job['title'] }}</h3>
<p>{{ job['company'] }}</p>
<p>{{ job['location'] }}</p>
{% endif %}

<form method="POST" enctype="multipart/form-data">

<input type="text" name="name" placeholder="Full Name" required>

<input type="email" name="email" placeholder="Email" required>

<input type="text" name="phone_no" placeholder="Phone Number" required>
<input type="text" name="need_of_job" placeholder="Why do you need this job?" required>"
<label>Company</label>
<input type="text" name="company" placeholder="Enter Company Name" required>
<label>Upload Resume</label>
<input type="file" name="resume" required>

<button type="submit">Apply Job</button>

</form>

</div>

</body>
</html>
